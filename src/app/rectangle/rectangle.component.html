<div class="rectangle" >

<h2>Rectangle</h2>
<h3>{{result}}</h3>

<h3>length</h3>
<input type="number"  [(ngModel)]="length"  placeholder="Enter lenght"><br>
<h3>width</h3>
<input type="number"  [(ngModel)]="width"  placeholder="Enter width"><br>
<span>
<button class="area" (click)="area()" >Area</button>
<button class="perimeter" (click)="perimeter()">Perimeter</button></span>
</div>
